<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhoneView — Sender</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap');
  :root {
    --bg: #060a0d;
    --panel: #0c1218;
    --border: #162030;
    --accent: #00e5ff;
    --accent2: #ff3c6e;
    --accent3: #39ff7a;
    --text: #b8cdd8;
    --dim: #3a5060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
    pointer-events: none; z-index: 999;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: rgba(12,18,24,0.97);
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; letter-spacing: 0.15em; color: var(--accent); text-shadow: 0 0 12px rgba(0,229,255,0.4); }
  .logo span { color: var(--accent2); }
  .badge { font-size: 0.65rem; letter-spacing: 0.15em; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--dim); color: var(--dim); }
  .badge.live { border-color: var(--accent3); color: var(--accent3); animation: blink 1.5s infinite; }
  .badge.waiting { border-color: #ffaa00; color: #ffaa00; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; gap: 20px; }

  .card {
    width: 100%; max-width: 420px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.3;
  }
  .card-header {
    padding: 10px 15px; border-bottom: 1px solid var(--border);
    font-size: 0.65rem; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase;
  }
  .card-body { padding: 18px 15px; }

  .start-btn {
    display: block; width: 100%; padding: 14px;
    background: linear-gradient(135deg, rgba(0,229,255,0.1), rgba(0,229,255,0.03));
    border: 1px solid var(--accent); color: var(--accent);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
    letter-spacing: 0.2em; text-transform: uppercase; border-radius: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  .start-btn:hover { background: rgba(0,229,255,0.15); box-shadow: 0 0 20px rgba(0,229,255,0.2); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .stop-btn {
    display: block; width: 100%; padding: 11px;
    background: transparent; border: 1px solid var(--accent2); color: var(--accent2);
    font-family: 'Share Tech Mono', monospace; font-size: 0.72rem;
    letter-spacing: 0.15em; text-transform: uppercase; border-radius: 7px;
    cursor: pointer; transition: all 0.2s; margin-top: 10px;
  }
  .stop-btn:hover { background: rgba(255,60,110,0.1); }

  .status-list { display: flex; flex-direction: column; gap: 10px; }
  .status-row { display: flex; align-items: center; gap: 12px; font-size: 0.72rem; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; transition: all 0.3s; }
  .dot.ok { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }
  .dot.err { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1s infinite; }

  video { display: none; }
  canvas { display: none; }

  .hint { font-size: 0.62rem; color: var(--dim); line-height: 1.7; text-align: center; max-width: 340px; }
</style>
</head>
<body>
<header>
  <div class="logo">PHONE<span>VIEW</span> <span style="font-size:0.6rem;color:var(--dim);font-family:'Share Tech Mono'">SENDER</span></div>
  <div class="badge waiting" id="badge">CONNECTING...</div>
</header>

<main>
  <div class="card">
    <div class="card-header">▸ STREAM STATUS</div>
    <div class="card-body">
      <div class="status-list">
        <div class="status-row"><div class="dot" id="d-ws"></div>Server connection</div>
        <div class="status-row"><div class="dot" id="d-cam"></div>Camera stream</div>
        <div class="status-row"><div class="dot" id="d-loc"></div>GPS location</div>
        <div class="status-row"><div class="dot" id="d-bat"></div>Battery info</div>
        <div class="status-row"><div class="dot" id="d-viewer"></div>Viewer connected</div>
      </div>
      <br>
      <button class="start-btn" id="startBtn" onclick="startAll()">▶ START STREAMING</button>
      <button class="stop-btn" id="stopBtn" onclick="stopAll()" style="display:none">■ STOP STREAMING</button>
    </div>
  </div>

  <p class="hint">Keep this page open and your screen on while streaming. The viewer on your other phone will see your camera, location and battery in real time.</p>
</main>

<video id="vid" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}`;

  let ws, stream, frameInterval, locWatch;
  let running = false;

  function dot(id, state) {
    const el = document.getElementById('d-' + id);
    el.className = 'dot ' + (state || '');
  }

  function connectWS() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'register', role: 'sender' }));
      dot('ws', 'ok');
      document.getElementById('badge').className = 'badge live';
      document.getElementById('badge').textContent = 'CONNECTED';
    };
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'viewer_connected') dot('viewer', 'ok');
    };
    ws.onclose = () => {
      dot('ws', 'err');
      document.getElementById('badge').className = 'badge waiting';
      document.getElementById('badge').textContent = 'RECONNECTING...';
      setTimeout(connectWS, 3000);
    };
    ws.onerror = () => ws.close();
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      const vid = document.getElementById('vid');
      vid.srcObject = stream;
      dot('cam', 'active');

      // Send frames every 200ms (~5fps to save bandwidth)
      frameInterval = setInterval(() => {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = vid.videoWidth || 320;
        canvas.height = vid.videoHeight || 240;
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        const frame = canvas.toDataURL('image/jpeg', 0.5);
        send({ type: 'camera_frame', frame });
      }, 200);
    } catch(e) {
      dot('cam', 'err');
    }
  }

  function startLocation() {
    if (!navigator.geolocation) { dot('loc', 'err'); return; }
    locWatch = navigator.geolocation.watchPosition(
      (pos) => {
        dot('loc', 'ok');
        send({
          type: 'location',
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: Math.round(pos.coords.accuracy)
        });
      },
      () => dot('loc', 'err'),
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  }

  async function startBattery() {
    try {
      const bat = await navigator.getBattery();
      function sendBat() {
        send({ type: 'battery', level: Math.round(bat.level * 100), charging: bat.charging });
      }
      sendBat();
      bat.addEventListener('levelchange', sendBat);
      bat.addEventListener('chargingchange', sendBat);
      dot('bat', 'ok');
    } catch(e) {
      dot('bat', 'err');
    }
  }

  function sendDeviceInfo() {
    const ua = navigator.userAgent;
    let os = 'Unknown';
    if (/Android/i.test(ua)) os = 'Android ' + (ua.match(/Android ([\d.]+)/)?.[1] || '');
    else if (/iPhone|iPad/i.test(ua)) os = 'iOS ' + (ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g,'.') || '');
    let br = 'Unknown';
    if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) br = 'Chrome';
    else if (/Firefox/i.test(ua)) br = 'Firefox';
    else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) br = 'Safari';
    const conn = navigator.connection;
    send({
      type: 'device',
      os, browser: br,
      screen: `${screen.width}×${screen.height}`,
      network: conn ? conn.effectiveType : (navigator.onLine ? 'Online' : 'Offline')
    });
  }

  async function startAll() {
    running = true;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
    await startCamera();
    startLocation();
    await startBattery();
    sendDeviceInfo();
  }

  function stopAll() {
    running = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
    if (locWatch) { navigator.geolocation.clearWatch(locWatch); locWatch = null; }
    dot('cam', ''); dot('loc', ''); dot('bat', '');
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display = 'none';
  }

  connectWS();
</script>
</body>
</html>
